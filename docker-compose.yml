services:
  energy-launch:
    build:
      context: .
      target: runtime
      args:
        # auto – кейс 4 из смонтированной папки (если есть), synthetic – синтетический портфель
        VITE_DATASET: ${VITE_DATASET:-auto}
    image: energy-launch:local
    ports:
      - "127.0.0.1:8080:8080"
    # Данные кейса 4 не входят в образ: монтируются локально, только чтение.
    # Без папки public/case4 приложение работает на синтетических данных.
    volumes:
      - ./public/case4:/usr/share/nginx/html/case4:ro
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped

  # Сервер хранилища: объекты, ход запуска, журнал аудита (только дополняется)
  api:
    build:
      context: .
      target: api
    image: energy-launch-api:local
    environment:
      # Пароль – только из .env (в репозиторий не попадает)
      DATABASE_URL: postgres://energy_launch:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@db:5432/energy_launch
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    restart: unless-stopped

  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: energy_launch
      POSTGRES_USER: energy_launch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт базы наружу не открыт; для pgAdmin/DBeaver на этой машине раскомментируйте:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy_launch -d energy_launch"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
