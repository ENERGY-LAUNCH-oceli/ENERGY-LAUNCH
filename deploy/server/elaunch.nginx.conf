# ENERGY LAUNCH на общем сервере: /etc/nginx/sites-available/elaunch.xroyse.ru
# Статика – /var/www/elaunch, API хранилища – служба energy-launch-api (127.0.0.1:8790).
# HTTPS добавляет certbot --nginx (блоки listen 443 и перенаправление с 80).

# Ограничение частоты запросов к API (зона объявляется в контексте http – файл подключается внутри него)
limit_req_zone $binary_remote_addr zone=elaunch_api:10m rate=20r/s;

server {
  listen 80;
  listen [::]:80;
  server_name elaunch.xroyse.ru;

  root /var/www/elaunch;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # Страницы ошибок самого веб-сервера (приложение не загрузилось или служба API не отвечает): /status/<код>.html.
  # Ответы приложения и API (proxy_intercept_errors off) не подменяются.
  error_page 400 /status/400.html;
  error_page 401 /status/401.html;
  error_page 403 /status/403.html;
  error_page 404 /status/404.html;
  error_page 405 /status/405.html;
  error_page 408 /status/408.html;
  error_page 413 /status/413.html;
  error_page 414 /status/414.html;
  error_page 429 /status/429.html;
  error_page 500 /status/500.html;
  error_page 501 /status/501.html;
  error_page 502 /status/502.html;
  error_page 503 /status/503.html;
  error_page 504 /status/504.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API хранилища (PostgreSQL)
  location /api/ {
    limit_req zone=elaunch_api burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32m;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
  }

  # Набор кейса 4: публикация разрешена владельцем данных (07.11.2026); только реальные файлы, без подмены на index.html
  location /case4/ {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Карты исходников не раздаются
  location ~* \.map$ {
    return 404;
  }

  # Маршруты SPA
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  }
}
