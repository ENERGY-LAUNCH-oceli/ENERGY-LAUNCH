server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # Страницы ошибок самого веб-сервера (приложение не загрузилось или служба API не отвечает): /status/<код>.html.
  # Ответы приложения и API (proxy_intercept_errors off) не подменяются.
  error_page 400 /status/400.html;
  error_page 401 /status/401.html;
  error_page 403 /status/403.html;
  error_page 404 /status/404.html;
  error_page 405 /status/405.html;
  error_page 408 /status/408.html;
  error_page 413 /status/413.html;
  error_page 414 /status/414.html;
  error_page 429 /status/429.html;
  error_page 500 /status/500.html;
  error_page 501 /status/501.html;
  error_page 502 /status/502.html;
  error_page 503 /status/503.html;
  error_page 504 /status/504.html;

  # Набор кейса 4: только реальные файлы, без подмены на index.html (иначе приложение примет HTML за данные)
  location /case4/ {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # API хранилища (PostgreSQL): сервис api из docker-compose. Имя разрешается при запросе –
  # nginx стартует, даже если api ещё не поднят.
  location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8787;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 32m;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
  }

  # Маршруты SPA
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # Карты исходников не раздаются
  location ~* \.map$ { return 404; }
}
